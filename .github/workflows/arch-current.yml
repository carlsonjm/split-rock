name: Arch current

# Builds and checks Split Rock against Arch Linux's current KDE and Qt
# packages, so a KDE update that breaks the build shows here before it reaches
# a device. Every test uses the pretend assistant; no account or network is
# needed.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: Split Rock is shelved, and its minutes are counted.
    - cron: "47 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arch-current-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Arch current
    runs-on: ubuntu-latest
    # Privileged so bubblewrap can build the fence the assistant runs in, and
    # the fence tests run instead of skipping.
    container:
      image: ghcr.io/archlinux/archlinux:latest
      options: --privileged
    timeout-minutes: 60
    steps:
      # Noto Sans is Plasma's own font. The layout tests measure text in it,
      # so the check sees text at the widths a Plasma desktop draws it.
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake ninja git python dbus bubblewrap noto-fonts \
            qt6-base qt6-declarative layer-shell-qt kirigami

      - uses: actions/checkout@v5

      - name: Record the KDE and Qt versions checked
        run: |
          pacman -Q qt6-base qt6-declarative layer-shell-qt kirigami bubblewrap noto-fonts
          fc-match sans-serif

      - name: Run ./verify.sh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dbus-run-session -- ./verify.sh
