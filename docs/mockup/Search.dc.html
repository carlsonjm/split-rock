<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split Rock — Search doors</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F8F8FF}a:hover{color:#FFFFFF}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:16px;height:16px}
.ico.xs{width:14px;height:14px}
.ico.l{width:30px;height:30px}
button{font-family:Manrope,sans-serif;cursor:pointer}
input{font-family:Manrope,sans-serif}
.band{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;color:#F8F8FF}
.island{height:40px;border-radius:20px;background:#141414;border:1px solid #333;display:flex;align-items:center;gap:10px;padding:0 16px 0 5px;font-size:13px;box-sizing:border-box}
.dock{display:flex;gap:6px;align-items:center;background:#141414;border:1px solid #333;border-radius:16px;padding:5px}
.dk{width:44px;height:44px;border-radius:12px;background:#242424;display:flex;align-items:center;justify-content:center;border:0;color:#F8F8FF;position:relative;padding:0}
.status{display:flex;align-items:center;gap:14px;height:40px;padding:0 6px 0 14px;border-radius:20px;background:#141414;border:1px solid #333;font-size:13px;box-sizing:border-box}
.door{width:132px;height:132px;border-radius:24px;border:0;background:#1C1C1C;color:#F8F8FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-size:15px;font-weight:700}
.door .tile{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center}
.recent{width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:#C8C8CE;font-weight:600;text-align:center}
.recent span.t{width:56px;height:56px;border-radius:16px;background:#242424;display:flex;align-items:center;justify-content:center;color:#F8F8FF}
.opt{display:flex;align-items:center;gap:14px;min-height:48px;font-size:15px;font-weight:600}
.opt input{width:22px;height:22px;accent-color:#F8F8FF;margin:0}
.sub{font-size:12px;color:#AFAFAF;font-weight:600;margin-left:auto}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #F8F8FF; background: #1F2F38">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #4A6676 0%, #34505F 48%, #233741 80%, #3B302A 100%)"></div>
  <div style="position: absolute; left: 10px; top: 10px; right: 10px; bottom: 74px; background: #141414; border-radius: 8px"></div>
  <div style="position: absolute; inset: 0; background: rgba(0,0,0,0.6)"></div>

  <div style="position: absolute; left: 150px; top: 70px; width: 640px; display: flex; flex-direction: column; gap: 28px">
    <label style="display: flex; align-items: center; gap: 14px; height: 64px; border-radius: 32px; background: #1C1C1C; border: 1px solid #F8F8FF; padding: 0 10px 0 22px; box-sizing: border-box">
      <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search, or ask Genie" aria-label="Search" style="flex: 1; background: transparent; border: 0; outline: none; color: #F8F8FF; font-size: 20px; font-weight: 600">
      <button aria-label="Search settings" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F8F8FF; color: #141414; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </label>

    <div style="display: flex; gap: 20px">
      <button class="door"><span class="tile" style="background: #242424"><svg class="ico l" viewBox="0 0 24 24"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg></span>Apps</button>
      <button class="door"><span class="tile" style="background: #242424"><svg class="ico l" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></span>Files</button>
      <button class="door"><span class="tile" style="background: #F2D98A; color: #1A1A1A"><svg class="ico l" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></span>Notes</button>
      <button class="door"><span class="tile" style="background: #C7B8F5; color: #1A1A1A"><svg class="ico l" viewBox="0 0 24 24" style="stroke-width: 2"><path d="M5 12h8.5c3 0 5.5-1.5 8-3.5-.8 5-4.3 8.5-9.5 8.5C7.5 17 5 15 5 12Z"/><path d="M7.5 12a3 3 0 0 1 6 0"/><path d="M10.5 7.4h.01"/><path d="M5.2 12.8C2.6 11.6 1 13.2 1.5 15c.5 1.7 2.5 2 4.4 1"/><path d="M12 17v1.5M9 21.5a3 3 0 0 1 6 0Z"/><path d="M21.5 8.5c.7-1.8-.2-3.6-1.9-4"/><path d="M17.4 1.6Q17.8 3 19.2 3.4Q17.8 3.8 17.4 5.2Q17 3.8 15.6 3.4Q17 3 17.4 1.6Z"/></svg></span>Genie</button>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: 800; color: #8A8A90; letter-spacing: 0.06em; margin-bottom: 14px">LATELY</div>
      <div style="display: flex; gap: 8px">
        <div class="recent"><span class="t"><svg class="ico" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></span>Kate</div>
        <div class="recent"><span class="t"><svg class="ico" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></svg></span>ROADMAP.md</div>
        <div class="recent"><span class="t"><svg class="ico" viewBox="0 0 24 24"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg></span>Konsole</div>
        <div class="recent"><span class="t"><svg class="ico" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></span>palisade.png</div>
      </div>
    </div>
  </div>

  <aside aria-label="Search settings" style="position: absolute; right: 120px; top: 70px; width: 340px; background: #141414; border: 1px solid #333; border-radius: 12px; padding: 18px 20px; box-sizing: border-box">
    <h2 style="margin: 0 0 6px; font-size: 16px; font-weight: 800">Search</h2>
    <div style="font-size: 12px; font-weight: 800; color: #8A8A90; letter-spacing: 0.06em; margin: 12px 0 4px">DOORS</div>
    <label class="opt"><input type="checkbox" checked disabled>Apps<span class="sub">Always</span></label>
    <label class="opt"><input type="checkbox" checked disabled>Files<span class="sub">Always</span></label>
    <label class="opt"><input type="checkbox" checked>Notes<span class="sub">Gooseberry</span></label>
    <label class="opt"><input type="checkbox" checked>Genie<span class="sub">Split Rock</span></label>
    <div style="height: 1px; background: #2A2A2A; margin: 10px 0"></div>
    <label class="opt"><input type="checkbox" checked>Show recent files and apps</label>
    <div style="font-size: 12px; color: #AFAFAF; line-height: 1.5; margin-top: 6px">A door shows only when its app is installed.</div>
  </aside>

  <div class="band">
    <div class="island">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #242424; display: flex; align-items: center; justify-content: center"><svg class="ico xs" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span>Low Tide · Shoreline</span>
    </div>
    <div class="dock">
      <button class="dk" aria-label="Search" style="background: #F8F8FF"><span style="width: 14px; height: 14px; border-radius: 7px; background: #141414"></span></button>
      <button class="dk" aria-label="Files"><svg class="ico" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
      <button class="dk" aria-label="Firefox"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
      <button class="dk" aria-label="Kate"><svg class="ico" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg></button>
      <button class="dk" aria-label="Notes" style="background: #F2D98A; color: #1A1A1A"><svg class="ico" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></button>
      <button class="dk" aria-label="Genie" style="background: #C7B8F5; color: #1A1A1A"><svg class="ico" viewBox="0 0 24 24" style="stroke-width: 2"><path d="M5 12h8.5c3 0 5.5-1.5 8-3.5-.8 5-4.3 8.5-9.5 8.5C7.5 17 5 15 5 12Z"/><path d="M7.5 12a3 3 0 0 1 6 0"/><path d="M10.5 7.4h.01"/><path d="M5.2 12.8C2.6 11.6 1 13.2 1.5 15c.5 1.7 2.5 2 4.4 1"/><path d="M12 17v1.5M9 21.5a3 3 0 0 1 6 0Z"/><path d="M21.5 8.5c.7-1.8-.2-3.6-1.9-4"/><path d="M17.4 1.6Q17.8 3 19.2 3.4Q17.8 3.8 17.4 5.2Q17 3.8 15.6 3.4Q17 3 17.4 1.6Z"/></svg></button>
    </div>
    <div class="status">
      <svg class="ico s" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <svg class="ico s" viewBox="0 0 24 24"><rect width="16" height="10" x="2" y="7" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/></svg>
      <span style="font-weight: 600">10:20 AM</span>
      <button class="dk" aria-label="Notifications" style="width: 30px; height: 30px; border-radius: 15px"><svg class="ico xs" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
