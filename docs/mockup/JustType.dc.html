<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split Rock — Just Type</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F8F8FF}a:hover{color:#FFFFFF}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ico.s{width:16px;height:16px}
.ico.xs{width:14px;height:14px}
button{font-family:Manrope,sans-serif;cursor:pointer}
input{font-family:Manrope,sans-serif}
.band{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-sizing:border-box;color:#F8F8FF}
.island{height:40px;border-radius:20px;background:#141414;border:1px solid #333;display:flex;align-items:center;gap:10px;padding:0 16px 0 5px;font-size:13px;box-sizing:border-box}
.dock{display:flex;gap:6px;align-items:center;background:#141414;border:1px solid #333;border-radius:16px;padding:5px}
.dk{width:44px;height:44px;border-radius:12px;background:#242424;display:flex;align-items:center;justify-content:center;border:0;color:#F8F8FF;position:relative;padding:0}
.status{display:flex;align-items:center;gap:14px;height:40px;padding:0 6px 0 14px;border-radius:20px;background:#141414;border:1px solid #333;font-size:13px;box-sizing:border-box}
.tb{height:32px;background:#1C1C1C;display:flex;align-items:center;justify-content:space-between;padding:0 4px 0 10px;font-size:13px;color:#F8F8FF;flex:none}
.bar{height:10px;border-radius:5px;background:#2A2A2F}
.chip{height:40px;border-radius:20px;padding:0 16px;border:1px solid #5A5A5A;background:#242424;color:#F8F8FF;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.step{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.45;color:#E4E4EA}
.num{width:24px;height:24px;border-radius:12px;background:#242424;color:#F8F8FF;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #F8F8FF; background: #1F2F38">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #4A6676 0%, #34505F 48%, #233741 80%, #3B302A 100%)"></div>

  <div style="position: absolute; left: 10px; top: 10px; right: 10px; bottom: 74px; background: #141414; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column">
    <div class="tb"><span style="width: 160px"></span><span>Music — Elisa</span><span style="width: 160px"></span></div>
    <div style="flex: 1; padding: 28px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; align-content: start">
      <div style="aspect-ratio: 1; border-radius: 10px; background: #2B3A44"></div>
      <div style="aspect-ratio: 1; border-radius: 10px; background: #3A2F2A"></div>
      <div style="aspect-ratio: 1; border-radius: 10px; background: #2A3A33"></div>
      <div style="aspect-ratio: 1; border-radius: 10px; background: #36304A"></div>
      <div style="aspect-ratio: 1; border-radius: 10px; background: #2C2C30"></div>
    </div>
  </div>
  <div style="position: absolute; left: 10px; top: 10px; right: 10px; bottom: 74px; border-radius: 8px; background: rgba(0,0,0,0.5)"></div>

  <section aria-label="Genie" style="position: absolute; left: 270px; bottom: 74px; width: 740px; background: #141414; border: 1px solid #333; border-bottom: 0; border-radius: 22px 22px 0 0; padding: 12px 22px 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: center"><div style="width: 44px; height: 5px; border-radius: 3px; background: #4A4A4A"></div></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800">
        <span style="width: 32px; height: 32px; border-radius: 10px; background: #C7B8F5; color: #1A1A1A; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24" style="stroke-width: 2"><path d="M5 12h8.5c3 0 5.5-1.5 8-3.5-.8 5-4.3 8.5-9.5 8.5C7.5 17 5 15 5 12Z"/><path d="M7.5 12a3 3 0 0 1 6 0"/><path d="M10.5 7.4h.01"/><path d="M5.2 12.8C2.6 11.6 1 13.2 1.5 15c.5 1.7 2.5 2 4.4 1"/><path d="M12 17v1.5M9 21.5a3 3 0 0 1 6 0Z"/><path d="M21.5 8.5c.7-1.8-.2-3.6-1.9-4"/><path d="M17.4 1.6Q17.8 3 19.2 3.4Q17.8 3.8 17.4 5.2Q17 3.8 15.6 3.4Q17 3 17.4 1.6Z"/></svg></span>
        Genie
      </div>
      <a href="Workspace.dc.html" style="height: 40px; border-radius: 20px; padding: 0 14px; background: #242424; color: #F8F8FF; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">
        <svg class="ico s" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="M21 3l-7 7"/><path d="M3 21l7-7"/></svg>Expand
      </a>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; height: 60px; border-radius: 30px; background: #1C1C1C; border: 1px solid #F8F8FF; padding: 0 8px 0 22px; box-sizing: border-box">
      <input value="{{query}}" onChange="{{onQuery}}" aria-label="Ask Genie" placeholder="Ask, or say what you want done" style="flex: 1; background: transparent; border: 0; outline: none; color: #F8F8FF; font-size: 20px; font-weight: 600">
      <button aria-label="Send" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #F8F8FF; color: #141414; display: flex; align-items: center; justify-content: center"><svg class="ico s" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
    </label>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for list="{{sugs}}" as="s" hint-placeholder-count="3">
        <button class="chip" onClick="{{s.pick}}" style="background: {{s.bg}}; color: {{s.fg}}; border-color: {{s.edge}}">{{s.label}}</button>
      </sc-for>
    </div>

    <div style="background: #1C1C1C; border-radius: 16px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-height: 196px; box-sizing: border-box">
      <div style="font-size: 16px; font-weight: 700">{{headline}}</div>
      <sc-for list="{{steps}}" as="st" hint-placeholder-count="3">
        <div class="step"><span class="num">{{st.n}}</span><span>{{st.text}}</span></div>
      </sc-for>
      <div style="display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap">
        <a href="DoIt.dc.html" style="height: 44px; border-radius: 22px; padding: 0 18px; background: #F8F8FF; color: #141414; text-decoration: none; display: inline-flex; align-items: center; font-size: 14px; font-weight: 800">{{action}}</a>
        <button class="chip" style="height: 44px">Show me how</button>
        <button class="chip" style="height: 44px">Keep this</button>
      </div>
    </div>
  </section>

  <div class="band">
    <div class="island">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #242424; display: flex; align-items: center; justify-content: center"><svg class="ico xs" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
      <span>Low Tide · Shoreline</span>
    </div>
    <div class="dock">
      <button class="dk" aria-label="Search" style="background: transparent"><span style="width: 14px; height: 14px; border-radius: 7px; background: #F8F8FF"></span></button>
      <button class="dk" aria-label="Files"><svg class="ico" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg></button>
      <button class="dk" aria-label="Firefox"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
      <button class="dk" aria-label="Music"><svg class="ico" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span style="position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 2px; background: #F8F8FF"></span></button>
      <button class="dk" aria-label="Notes" style="background: #F2D98A; color: #1A1A1A"><svg class="ico" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg></button>
      <button class="dk" aria-label="Genie" style="background: #C7B8F5; color: #1A1A1A"><svg class="ico" viewBox="0 0 24 24" style="stroke-width: 2"><path d="M5 12h8.5c3 0 5.5-1.5 8-3.5-.8 5-4.3 8.5-9.5 8.5C7.5 17 5 15 5 12Z"/><path d="M7.5 12a3 3 0 0 1 6 0"/><path d="M10.5 7.4h.01"/><path d="M5.2 12.8C2.6 11.6 1 13.2 1.5 15c.5 1.7 2.5 2 4.4 1"/><path d="M12 17v1.5M9 21.5a3 3 0 0 1 6 0Z"/><path d="M21.5 8.5c.7-1.8-.2-3.6-1.9-4"/><path d="M17.4 1.6Q17.8 3 19.2 3.4Q17.8 3.8 17.4 5.2Q17 3.8 15.6 3.4Q17 3 17.4 1.6Z"/></svg><span style="position: absolute; bottom: 3px; width: 4px; height: 4px; border-radius: 2px; background: #1A1A1A"></span></button>
    </div>
    <div class="status">
      <svg class="ico s" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M2 8.82a15 15 0 0 1 20 0"/><path d="M5 12.859a10 10 0 0 1 14 0"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/></svg>
      <svg class="ico s" viewBox="0 0 24 24"><rect width="16" height="10" x="2" y="7" rx="2"/><path d="M22 11v2"/><path d="M6 11v2"/><path d="M10 11v2"/></svg>
      <span style="font-weight: 600">10:12 AM</span>
      <button class="dk" aria-label="Notifications" style="width: 30px; height: 30px; border-radius: 15px"><svg class="ico xs" viewBox="0 0 24 24"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 0, query: 'My headphones keep cutting out' };
  }
  renderVals() {
    const answers = [
      {
        label: 'My headphones keep cutting out',
        headline: 'Bluetooth and Wi-Fi share the same radio here. Two things usually fix it:',
        steps: [
          'Turn off Wi-Fi power saving, which pauses the radio your headphones need.',
          'If it still drops, move the headphones to the faster Bluetooth mode.',
          'This computer had the same problem in June; the first step fixed it then.'
        ],
        action: 'Do it: turn off Wi-Fi power saving'
      },
      {
        label: 'Make the writing bigger',
        headline: 'Everything on screen can grow together, or just the text:',
        steps: [
          'Scale grows everything, 125% is a common choice on this screen.',
          'Text size grows only the words, and leaves pictures as they are.',
          'Either can be put back the same way.'
        ],
        action: 'Do it: scale to 125%'
      },
      {
        label: 'What changed yesterday?',
        headline: 'Two changes were made yesterday, both with an Undo:',
        steps: [
          'Night Color turned on at sunset, at your request.',
          'Updates installed, with a snapshot taken first.',
          'Nothing else on this computer changed.'
        ],
        action: 'Open the record'
      }
    ];
    const s = this.state;
    const a = answers[s.pick];
    return {
      query: s.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      headline: a.headline,
      steps: a.steps.map((t, i) => ({ n: i + 1, text: t })),
      action: a.action,
      sugs: answers.map((x, i) => ({
        label: x.label,
        bg: i === s.pick ? '#F8F8FF' : '#242424',
        fg: i === s.pick ? '#141414' : '#F8F8FF',
        edge: i === s.pick ? '#F8F8FF' : '#5A5A5A',
        pick: () => this.setState({ pick: i, query: x.label })
      }))
    };
  }
}
</script>
</body>
</html>
